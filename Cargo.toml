[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Bilchreis/MUST"
authors = ["Peter Braun"]

[workspace.dependencies]
must-launch = { path = "crates/must-launch" }
must-monitor = { path = "crates/must-monitor" }
must-server = { path = "crates/must-server" }
must-types = { path = "crates/must-types" }
async-trait = "0.1"
base64 = "0.22"
cc = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
if-addrs = "0.15"
indexmap = "2"
jiff = "1"
libloading = "0.9"
proptest = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
