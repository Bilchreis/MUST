[package]
name = "must-tui"
description = "Terminal UI showing all running MUST SEC nodes of the user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "must-tui"
path = "src/main.rs"

[[bin]]
name = "must"
path = "src/bin/must.rs"

[dependencies]
chrono.workspace = true
indexmap.workspace = true
must-monitor.workspace = true
must-types.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
insta = "1.49.0"
must-server.workspace = true

[lints]
workspace = true
