[package]
name = "must-tui"
description = "Terminal UI showing all running must SEC nodes of the user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "must-tui"
path = "src/main.rs"

[dependencies]
indexmap.workspace = true
must-monitor.workspace = true
must-types.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
insta = "1.49.0"
must-server.workspace = true

[lints]
workspace = true
