name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # 32-bit Windows (32-bit LabVIEW); runs natively on the 64-bit runner
          - os: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}
      - name: cargo test
        shell: bash
        run: |
          cargo test --workspace --target ${{ matrix.target }} 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          # make sure tests actually ran on this target, not only compiled
          grep -E "test result: ok\. [1-9][0-9]* passed" test.log
