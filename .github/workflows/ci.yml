name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # a hanging test must not block CI for hours
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # 32-bit Windows (32-bit LabVIEW); runs natively on the 64-bit runner
          - os: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --target ${{ matrix.target }}
      # opening the status TUI in xterm is tested under Xvfb
      - name: Xvfb and xterm
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xterm
      - name: cargo test
        shell: bash
        run: |
          cargo test --workspace --target ${{ matrix.target }} 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          # make sure tests actually ran on this target, not only compiled
          grep -E "test result: ok\. [1-9][0-9]* passed" test.log
      # the manual monitoring session documented in docs/monitoring-protocol.md
      - name: monitoring session with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --example simple_node --target ${{ matrix.target }}
          $node = Start-Process -PassThru -FilePath "target/${{ matrix.target }}/debug/examples/simple_node.exe" -ArgumentList '127.0.0.1:0' -RedirectStandardOutput node.out -RedirectStandardError node.err
          try {
            $file = "$env:LOCALAPPDATA\must\run\$($node.Id).json"
            for ($i = 0; $i -lt 60 -and -not (Test-Path $file); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $file)) {
              Get-Content node.out, node.err -ErrorAction SilentlyContinue
              throw "no registration $file (node exited: $($node.HasExited))"
            }
            $reg  = Get-Content $file | ConvertFrom-Json
            $name = $reg.endpoint.name -replace '^\\\\\.\\pipe\\', ''
            $pipe = New-Object System.IO.Pipes.NamedPipeClientStream('.', $name, 'InOut')
            $pipe.Connect(5000)
            $w = New-Object System.IO.StreamWriter($pipe); $w.AutoFlush = $true
            $r = New-Object System.IO.StreamReader($pipe)
            $w.WriteLine('{"type":"hello","version":"1.0","client":"me"}')
            $welcome = $r.ReadLine(); $snapshot = $r.ReadLine()
            Write-Output $welcome
            if (-not $welcome.StartsWith('{"type":"welcome"')) { throw "no welcome: $welcome" }
            if (-not $snapshot.Contains('"equipment_id":"must-example"')) { throw "unexpected snapshot: $snapshot" }
          } finally {
            Stop-Process $node
          }

  dist:
    name: dist ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}
      # SHALL-named libraries, import libraries and headers
      - run: cargo xtask dist --target ${{ matrix.target }}
      # exports against the headers, no Qt or C runtime DLLs, handles across both libraries
      - run: cargo xtask check --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: must-shall-${{ matrix.target }}
          path: dist/${{ matrix.target }}

  interop:
    name: interop with Frappy and secop-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --example simple_node
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # both pinned for reproducibility
      - uses: actions/checkout@v7
        with:
          repository: SampleEnvironment/frappy
          ref: f3eacc28b84cd00acbcfb72799f3c37394e46f00
          path: frappy
      # the code of SampleEnvironment/secop-checker#1 (branch "work")
      - uses: actions/checkout@v7
        with:
          repository: SampleEnvironment/secop-checker
          ref: 895648c067b2ed5e1aa476b79678c300cbb5267f
          path: secop-checker
      - run: pip install pyyaml requests rich
      - name: start the example node
        run: |
          nohup target/debug/examples/simple_node 127.0.0.1:2055 > node.log 2>&1 &
          sleep 1
      # the Frappy client needs only the standard library
      - name: drive the example node with the Frappy client
        run: PYTHONPATH=frappy timeout 120 python crates/must-server/tests/interop/frappy_client.py localhost:2055
      - name: check the example node's description with secop-checker
        run: PYTHONPATH=secop-checker timeout 60 python crates/must-server/tests/interop/check_describe.py 127.0.0.1:2055
