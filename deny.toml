# cargo-deny configuration. Only dependency licenses that can be combined
# with MUST's LGPL-3.0-or-later license are allowed.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]

[licenses]
allow = [
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list covers licenses expected in future dependencies.
unused-allowed-license = "allow"

# RustSec advisories: vulnerable, unmaintained, unsound and yanked crates. CI checks them in
# the Advisories workflow, on dependency changes and weekly, so that a newly published
# advisory does not fail unrelated pull requests.
[advisories]
yanked = "deny"

# A second version of a crate is reported (warning) but allowed: syn 2 and 3 are both
# pulled in by proc macros.
[bans]
multiple-versions = "warn"

# Dependencies come from crates.io only.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
