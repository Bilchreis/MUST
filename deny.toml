# cargo-deny configuration: only dependency licenses that can be combined
# with must's LGPL-3.0-or-later license are allowed.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]

[licenses]
allow = [
    "LGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list covers licenses expected in future dependencies.
unused-allowed-license = "allow"
